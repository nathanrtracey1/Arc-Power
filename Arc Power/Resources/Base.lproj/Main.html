<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <title>Arcify Safari</title>
    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <div class="window-card">
        <div class="icon-wrap">
            <img src="../Icon.png" width="128" height="128" alt="" class="app-icon">
        </div>
        <h1 class="title">Arcify Safari</h1>
        <p class="instruction state-unknown">Quit this app and turn on Arcify Safari in Safari → Settings → Extensions to use the sidebar.</p>
        <p class="instruction state-on">The extension is on. You can turn it off in Safari → Settings → Extensions.</p>
        <p class="instruction state-off">The extension is off. Quit this app and turn it on in Safari → Settings → Extensions.</p>
        <button type="button" class="open-preferences">Quit and Open Safari Extensions…</button>
    </div>
</body>
</html>
