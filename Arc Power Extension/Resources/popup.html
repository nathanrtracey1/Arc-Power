<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcify</title>
  <style>
    body {
      font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      padding: 16px;
      min-width: 200px;
      background: #1c1c1e;
      color: #fff;
    }
    h3 { margin: 0 0 8px 0; font-size: 16px; }
    p { margin: 0; font-size: 13px; color: #8e8e93; }
  </style>
</head>
<body>
  <h3>Arcify</h3>
  <p>Press <kbd>⌘B</kbd> to toggle the tab panel.</p>
  <p style="margin-top: 8px; font-size: 12px;">Use a normal webpage (e.g. google.com). If nothing appears, refresh the page and try ⌘B again.</p>
  <script>
    (function () {
      var api = typeof browser !== "undefined" ? browser : chrome;
      if (!api.runtime) return;
      api.runtime.sendMessage({ action: "togglePanelFromPopup" }, function () {
        setTimeout(function () { window.close(); }, 80);
      });
    })();
  </script>
</body>
</html>
